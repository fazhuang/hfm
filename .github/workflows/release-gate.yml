name: HFM Release Gate

# P2-08 observability/release gates: the canonical release-gate command runs
# on every push/PR. No skipped or weakened gates (P2-08-AC-02).
on:
  push:
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - name: Install backend deps
        run: python -m pip install -e apps/backend
      - name: Install frontend deps
        run: cd apps/frontend && pnpm install --frozen-lockfile
      - name: Run release gate
        run: infra/scripts/release-gate.sh
